<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#151619">
<title>Script C&amp;C — демо</title>
<style>
:root{--bg:#151619;--s1:#1d1f23;--s2:#282a30;--ln:#33363c;--tx:#f3f3f4;--mu:#8d9097;--inv:#151619;--lf:none;--soft:#c9cacf;--soft-tx:#17181b;--soft-ln:#c9cacf;color-scheme:dark}
[data-theme=light]{--bg:#f3f3f4;--s1:#fff;--s2:#ebebed;--ln:#dcdde0;--tx:#151619;--mu:#6d7077;--inv:#fff;--lf:invert(1);--soft:#e4e5e8;--soft-tx:#151619;--soft-ln:#d6d7db;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,"Segoe UI",Roboto,Inter,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));transition:background .3s,color .3s}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:10px;font-weight:650}
.logo{width:26px;height:26px;filter:var(--lf)}
.logo.big{width:72px;height:72px}
.ic{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
button{font:inherit;color:inherit;cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .15s,opacity .2s}
button:active{transform:scale(.96)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--ln);background:var(--s1);display:grid;place-items:center}
main{padding:0 16px}
.screen{animation:in .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.hello{margin:18px 0 6px;font-size:22px;font-weight:650}
.hello small{display:block;font-size:14px;font-weight:400;color:var(--mu)}
h2{margin:18px 0 8px;font-size:22px}h2 small{color:var(--mu);font-size:15px;font-weight:400}
h3{margin:18px 0 8px;font-size:13px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.card h3{margin-top:0}
.muted{color:var(--mu)}.small{font-size:13px}p{margin:4px 0}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:14px 16px;margin:12px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row.g{margin:10px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.chip{flex:none;padding:9px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--s1)}
.chip.on,.seg .on,.st .on{background:var(--tx);color:var(--inv);border-color:var(--tx)}
input{width:100%;padding:13px 14px;background:var(--s1);border:1px solid var(--ln);border-radius:14px;color:var(--tx);font-size:16px;outline:0;transition:border-color .2s}
select{width:100%;padding:13px 14px;background:var(--s1);border:1px solid var(--ln);border-radius:14px;color:var(--tx);font:inherit;outline:0;transition:border-color .2s}
select:focus,input:focus{border-color:var(--tx)}select option{background:var(--s1);color:var(--tx)}
.optional{margin-left:5px;font-size:11px;font-weight:400;letter-spacing:0;text-transform:none}
.location-hint{margin:7px 2px 0}#cn{margin-top:10px}
.seg{display:flex;gap:4px;padding:4px;background:var(--s2);border-radius:14px}
.seg button{flex:1;padding:10px 4px;border:0;background:transparent;color:var(--mu);border-radius:10px}
.cta{width:100%;margin-top:20px;padding:15px;border:0;border-radius:16px;background:var(--tx);color:var(--inv);font-size:16px;font-weight:600}
.cta:disabled{opacity:.35}
.bar{height:6px;background:var(--s2);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--tx);border-radius:99px;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transition:width .3s}
@keyframes grow{from{transform:scaleX(0)}}
.bar.wide{width:240px;margin:14px auto}
.lead{animation:in .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(min(var(--i,0),10)*45ms)}
.hot{position:relative;min-width:44px;padding:3px 7px 4px;border-radius:9px;border:0;background:var(--s2);display:flex;flex-direction:column;align-items:center;line-height:1.1}
.hot b{font-size:12.5px}.hot small{margin-top:1px;font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.tip{position:absolute;right:0;top:calc(100% + 8px);width:220px;padding:10px 12px;border-radius:12px;background:var(--tx);color:var(--inv);font-size:12.5px;font-weight:400;line-height:1.35;letter-spacing:0;text-align:left;text-transform:none;opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .2s,transform .2s;z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.hot.open .tip{opacity:1;transform:none}
.pill{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill.none{background:var(--tx);color:var(--inv)}.pill.weak{border:1px solid var(--mu)}
.tel{display:inline-flex;align-items:center;gap:6px;color:var(--tx);text-decoration:none;font-size:14px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.st button{padding:9px 0;font-size:12.5px;border:1px solid var(--ln);background:transparent;color:var(--mu);border-radius:10px}
.top{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{margin:0}.tile b{display:block;font-size:30px;margin-top:4px}
.fn{display:grid;grid-template-columns:84px 1fr 40px;align-items:center;gap:10px;font-size:13px}
.fn em{font-style:normal;color:var(--mu);text-align:right}
.usr{padding:10px 0;border-top:1px solid var(--ln)}.usr:first-of-type{border:0;padding-top:0}
.ghost{flex:1;padding:13px;border:1px solid var(--ln);background:var(--s1);border-radius:14px;display:inline-flex;justify-content:center;align-items:center;gap:8px}
.center{display:grid;place-items:center;align-content:center;text-align:center;min-height:70vh;gap:6px}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1);opacity:.6}}
.empty{text-align:center;color:var(--mu);padding:60px 0}.empty .ic{width:36px;height:36px;opacity:.5}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--ln)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--mu);font-size:11px;padding:6px 0}
nav .on{color:var(--tx)}nav .on .ic{transform:translateY(-2px)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--tx);color:var(--inv);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ct{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.ct a{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border:1px solid var(--ln);border-radius:99px;background:var(--s2);color:var(--tx);text-decoration:none;font-size:12.5px;transition:transform .15s,background .2s}
.ct a:active{transform:scale(.95)}.ct a .ic{width:14px;height:14px}
.ct a.site{background:var(--tx);color:var(--inv);border-color:var(--tx);font-weight:600}
.cta{transition:box-shadow .25s,opacity .2s,transform .15s}.ct a{transition:transform .15s,background .2s,border-color .2s,opacity .2s}
@media(hover:hover){
.chip:hover:not(.on),.icon-btn:hover,.ghost:hover,.hot:hover{background:var(--s2);border-color:var(--mu)}
.chip.on:hover,.ct a.site:hover{opacity:.9}
.seg button:hover:not(.on){color:var(--tx);background:color-mix(in srgb,var(--tx) 7%,transparent)}
.st button:hover:not(.on){color:var(--tx);border-color:var(--mu);background:color-mix(in srgb,var(--tx) 6%,transparent)}
.ct a:not(.site):hover{border-color:var(--mu);background:color-mix(in srgb,var(--tx) 10%,var(--s2))}
.cta:hover:not(:disabled){box-shadow:0 0 0 4px color-mix(in srgb,var(--tx) 15%,transparent)}
nav button:hover{color:var(--tx)}.tel:hover{opacity:.7}.hot:hover .tip{opacity:1;transform:none}}
.edit{margin:10px 0 2px;padding:12px;border:1px solid var(--ln);border-radius:14px;background:var(--s2);animation:in .3s both}
.edit .chips{margin-top:10px}.edit .chip{background:var(--s1)}.edit .chip.on{background:var(--tx)}
.step{display:flex;gap:8px}.step button{width:34px;height:34px;border-radius:50%;border:1px solid var(--ln);background:var(--s1);font-size:18px;line-height:1}
.mini{padding:5px 10px;font-size:12px;display:inline-flex;align-items:center;gap:5px}.mini .ic{width:13px;height:13px}
.ghost.go{background:var(--tx);color:var(--inv);border-color:var(--tx);font-weight:600}
@media(hover:hover){.step button:hover{border-color:var(--mu)}}
.faq details{border-top:1px solid var(--ln)}.faq details:first-of-type{border-top:0}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;font-weight:600}
.faq summary::-webkit-details-marker{display:none}
.faq details p{margin:0 0 12px;color:var(--mu)}
.keys{display:grid;gap:14px}.keys div{display:grid;justify-items:start;gap:6px}
.keys b{padding:3px 9px;border-radius:8px;background:var(--s2);font-size:12.5px;font-weight:600;white-space:nowrap}
.keys span{color:var(--mu);font-size:14px}
.contact{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px;padding:14px;border-radius:16px;background:var(--tx);color:var(--inv);text-decoration:none;font-weight:600}

/* стартовая загрузка */
#pre{position:fixed;inset:0;z-index:50;display:grid;place-items:center;align-content:center;gap:14px;background:color-mix(in srgb,var(--bg) 55%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transition:opacity .6s ease,visibility .6s}
#pre.out{opacity:0;visibility:hidden}
#pre .pb{position:relative;width:96px;height:96px;-webkit-mask:var(--bird) center/contain no-repeat;mask:var(--bird) center/contain no-repeat;background:color-mix(in srgb,var(--tx) 16%,transparent);overflow:hidden}
#pre .pb i{position:absolute;inset:0;background:var(--tx);transform:translateY(100%);will-change:transform}
#pre b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--tx)}
/* загрузка поиска */
.beat{width:92px;height:92px;margin:0 auto 10px;animation:beat 1.9s ease-in-out infinite;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--tx) 16%,transparent))}
.beat .bird{width:100%;height:100%}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.13)}24%{transform:scale(.98)}36%{transform:scale(1.08)}52%{transform:scale(1)}}
.glow{position:relative;width:min(280px,80vw);height:8px;margin:16px auto 6px;border-radius:99px;background:var(--s2);overflow:visible}
.glow i{position:absolute;left:0;top:0;bottom:0;width:4%;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--tx) 55%,transparent),var(--tx),color-mix(in srgb,var(--tx) 55%,transparent));background-size:200% 100%;animation:shine 2.4s linear infinite;transition:width .45s cubic-bezier(.25,.8,.25,1)}
@keyframes shine{to{background-position:-200% 0}}
.stage{min-height:20px}
/* пробный доступ и спрос */
.access b.big{font-size:20px}
.offer{border-color:var(--tx)}
.offer p{white-space:pre-line}
.btns{display:grid;gap:8px;margin-top:12px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;padding:13px;border-radius:14px;border:1px solid var(--ln);background:var(--s1);color:var(--tx);text-decoration:none;font-weight:600;font-size:15px}
.btn.main{background:var(--tx);color:var(--inv);border-color:var(--tx)}
.keyform{display:flex;gap:8px;margin-top:10px}.keyform input{flex:1;text-transform:uppercase}.keyform input::placeholder{text-transform:none}
.keyform button{flex:none;width:auto;padding:0 16px}
.fire{width:100%;margin-top:12px;display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:16px;border:1px solid var(--ln);background:var(--s1);text-align:left}
.fire .ic{width:20px;height:20px;flex:none}.fire span{flex:1}.fire small{display:block;color:var(--mu);font-size:12px}
.fire .chev{width:16px;height:16px;color:var(--mu)}
.dm{padding:12px 0;border-top:1px solid var(--ln)}.dm:first-child{border:0;padding-top:4px}
.dm .row b{font-size:15px}.dm .meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:8px;font-size:13px;color:var(--mu)}
.dm .meta em{font-style:normal;color:var(--tx);font-weight:600}
.dm button{margin-top:10px}
/* карточка лида */
.need{display:inline-block;margin:8px 0 2px;font-size:13px;font-weight:600}
.why{margin-top:6px;padding:9px 11px;border-radius:12px;background:var(--s2);font-size:13px;line-height:1.4}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;display:inline-flex;justify-content:center;align-items:center;gap:6px;padding:10px 8px;border-radius:12px;border:1px solid var(--ln);background:transparent;font-size:13px}
.acts .gen{background:var(--tx);color:var(--inv);border-color:var(--tx);font-weight:600}
.acts .ic{width:16px;height:16px}
.info{margin-top:10px;border-top:1px solid var(--ln);padding-top:8px;animation:in .3s both}
.info div{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:5px 0;font-size:13px}
.info span{color:var(--mu)}.info em{font-style:normal;word-break:break-word}.info .no{color:var(--mu)}
.info a{color:var(--tx)}.cp{margin-left:4px;padding:2px 8px;border-radius:99px;border:1px solid var(--ln);background:transparent;font-size:11.5px;color:var(--mu)}
.pill.ok{border:1px dashed var(--mu)}
.srcnote{margin:18px 0 6px;text-align:center}.srcnote a{color:var(--mu)}
/* скрипты */
.lead-in{margin-top:6px}
.scr{padding:12px 0;border-top:1px solid var(--ln)}.scr:first-of-type{border:0;padding-top:2px}
.scr .row b{font-size:14.5px}.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--s2);color:var(--mu);font-weight:600}
.scr pre,.sheet pre{margin:8px 0 0;white-space:pre-wrap;font:inherit;font-size:14px;line-height:1.45;color:var(--tx)}
.scr pre.cut{max-height:4.4em;overflow:hidden;-webkit-mask:linear-gradient(#000 55%,transparent);mask:linear-gradient(#000 55%,transparent)}
textarea{width:100%;padding:12px;background:var(--s1);border:1px solid var(--ln);border-radius:14px;color:var(--tx);font:inherit;font-size:15px;resize:vertical;outline:0}
textarea:focus{border-color:var(--tx)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tools button{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:99px;border:1px solid var(--ln);background:transparent;font-size:12.5px}
.tools .ic{width:14px;height:14px}.tools .main{background:var(--tx);color:var(--inv);border-color:var(--tx)}
/* нижний лист */
#sheet{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45)}
#sheet.show{display:flex;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:86vh;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;background:var(--s1);border:1px solid var(--ln);border-bottom:0;animation:up .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .top h2{margin:4px 0 8px;font-size:19px}
.sheet .seg{margin:8px 0}.kinds{margin:6px -16px 10px!important}.kinds .chip{padding:7px 12px;font-size:13.5px}
.dots{display:flex;gap:6px;justify-content:center;padding:26px 0}.dots i{width:8px;height:8px;border-radius:50%;background:var(--tx);animation:dot 1.2s infinite both}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:none}}
/* админка */
.atabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.atabs::-webkit-scrollbar,.chips.scroll::-webkit-scrollbar{display:none}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--ln);color:var(--mu);white-space:nowrap}
.badge.m{background:var(--tx);color:var(--inv);border-color:var(--tx)}.badge.b{border-color:var(--tx);color:var(--tx)}
.urow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.urow button{padding:7px 10px;border-radius:10px;border:1px solid var(--ln);background:transparent;font-size:12.5px}
.form{display:grid;gap:8px}.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label{font-size:12px;color:var(--mu);display:grid;gap:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl td,.tbl th{padding:7px 4px;border-top:1px solid var(--ln);text-align:left}.tbl th{color:var(--mu);font-weight:600;border:0}
.tbl td:not(:first-child),.tbl th:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;padding:3px 8px;border-radius:8px;background:var(--s2)}
.still .screen,.still .lead,.still .edit,.still .info{animation:none}
/* единая типографика: заголовок карточки, обычный текст, второстепенный текст */
.meta{font-size:13px;color:var(--mu);margin:2px 0;line-height:1.45}
.center-text{text-align:center}
.lname{display:block;font-size:16.5px;font-weight:650;line-height:1.3}
.lhead{display:flex;align-items:flex-start;gap:10px}.lhead .lname{flex:1;min-width:0;overflow-wrap:anywhere}
.lx{flex:none;width:30px;height:30px;margin:-4px -6px 0 0;padding:0;border:0;border-radius:50%;background:transparent;color:var(--mu);display:grid;place-items:center;line-height:0;transition:color .15s,background .15s}
.lx .ic{width:17px;height:17px}
.del-q{margin:4px 0 6px;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.del-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.btn.danger{background:#e5484d;border-color:#e5484d;color:#fff}.btn.danger:disabled{opacity:.5}
@media (hover:hover){.lx:hover{color:#e5484d;background:color-mix(in srgb,#e5484d 12%,transparent)}.btn.danger:hover{background:#d13d42}}
.addr{font-size:14px;margin:6px 0 0;color:var(--tx)}
.phones{display:flex;align-items:center;gap:8px;margin-top:10px}
.phones .tel{font-size:15.5px;font-weight:600}
.more-ph{display:inline-flex;align-items:center;gap:2px;padding:4px 8px 4px 10px;border-radius:99px;border:1px solid var(--ln);background:var(--s2);font-size:12.5px;font-weight:600}
.more-ph .ic{width:14px;height:14px;transition:transform .2s}.more-ph.on .ic{transform:rotate(-90deg)}
.ic.down{transform:rotate(90deg)}
.ph-list{display:grid;gap:6px;margin:8px 0 0 2px;animation:in .25s both}
.tel.alt{font-size:15px;font-weight:500}
.acts{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-top:14px}
.acts .btn{padding:11px 10px;font-size:14px}
.acts>:only-child{grid-column:1/-1}
.btn.small{display:inline-flex;margin-top:10px;padding:9px 14px;font-size:13.5px}
.btn .ic{width:17px;height:17px}
/* ниши со спросом */
.lead-note{font-size:13.5px;color:var(--mu);margin:0 0 6px}
.dm{padding:14px 0;border-top:1px solid var(--ln)}.dm:first-of-type{border-top:0}
.dm-top{display:flex;align-items:center;gap:10px}
.dm-top b{flex:1;font-size:15.5px}
.dm-n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--s2);font-size:12px;font-weight:700;flex:none}
.score{font-size:13px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--tx);color:var(--inv);font-variant-numeric:tabular-nums}
.dm-why{margin:8px 0 0;font-size:14.5px;line-height:1.45}
.dm-offer{margin:6px 0 0;font-size:13.5px;color:var(--mu)}.dm-offer span{color:var(--tx);font-weight:600}
/* пояснение страницы — отдельный блок, сворачивается */
.intro{margin:12px 0;border-radius:18px;background:var(--soft);color:var(--soft-tx);border:1px solid var(--soft-ln);overflow:hidden}
.intro summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:650;font-size:15px}
.intro summary::-webkit-details-marker{display:none}
.intro .ic{width:18px;height:18px}
.intro-body{padding:0 16px 14px;font-size:14.5px;line-height:1.5}
.intro-body p{margin:0 0 8px}.intro-body .meta{color:color-mix(in srgb,var(--soft-tx) 68%,transparent)}
.steps{margin:0 0 10px;padding-left:18px;display:grid;gap:6px}
.steps b{font-weight:700}
/* список скриптов */
.scr{padding:14px 0;border-top:1px solid var(--ln)}.scr:first-of-type{border-top:0;padding-top:2px}
.scr-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.scr-head b{font-size:15px;font-weight:650}
.tag{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--s2);color:var(--mu);font-weight:600}
.tag.own{background:var(--tx);color:var(--inv)}
.scr-text{margin:8px 0 0;font-size:14.5px;line-height:1.5;white-space:pre-wrap;color:var(--tx)}
.scr-text.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tools button:disabled{opacity:.55;cursor:default}
/* как пользоваться */
.howto-steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:12px}
.howto-steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;column-gap:10px;row-gap:2px}
.howto-steps li::before{content:counter(s);grid-row:span 2;width:28px;height:28px;border-radius:50%;background:var(--tx);color:var(--inv);display:grid;place-items:center;font-weight:700;font-size:13px}
.howto-steps b{font-size:15px}
.howto-steps span{font-size:14px;color:var(--mu);line-height:1.45}
.faq-a{margin:0 0 12px;font-size:14.5px;line-height:1.5;color:var(--tx)}
.faq-a b{font-weight:650}
@media(hover:hover){
.tools button:not(.main):not(:disabled):hover,.urow button:hover,.cp:hover,.more-ph:hover,.fire:hover,.btn:not(.main):hover{background:var(--s2);border-color:var(--mu);color:var(--tx)}
.tools .main:hover,.btn.main:hover,.score:hover{opacity:.88}
.intro summary:hover{opacity:.92}
.faq summary:hover{color:var(--mu)}
select:hover,input:hover,textarea:hover{border-color:var(--mu)}
.chip:not(.on):hover{color:var(--tx)}}
.err{padding:8px 0;border-top:1px solid var(--ln);font-size:13px}.err:first-child{border:0}
/* ровные кнопки: иконки строго по центру */
.icon-btn{flex:none;padding:0;line-height:0}.icon-btn .ic{display:block}
.top{gap:12px}.top h2{min-width:0}
/* плюсик/крестик раскрытия */
.pm{flex:none;margin-left:auto;width:26px;height:26px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;opacity:.55;transition:transform .25s,opacity .2s}
.pm svg{width:12px;height:12px;display:block;stroke:currentColor;stroke-width:2;stroke-linecap:round;fill:none}
details[open]>summary .pm{transform:rotate(45deg)}
.faq summary .pm{color:var(--mu)}
/* выбор из списка: страна, город, ниша */
.pick{width:100%;display:flex;align-items:center;gap:10px;min-height:48px;padding:0 12px 0 14px;background:var(--s1);border:1px solid var(--ln);border-radius:14px;text-align:left;font-size:15.5px}
.pick span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pick .chv svg{width:14px;height:14px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pick.open{border-color:var(--tx)}.pick.open .chv{transform:rotate(180deg)}
.plist{display:grid;margin:4px 0 0}
.plist button{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 4px;border:0;border-top:1px solid var(--ln);background:none;text-align:left;font-size:15px}

.plist button .ok svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.plist button.on{font-weight:650}.plist button.on .ok{opacity:1}
.psearch{margin:4px 0 6px}
.pempty{padding:18px 0;text-align:center;color:var(--mu)}
/* ленты с кнопками прокрутки */
.hs{position:relative;margin:0 -16px}
.hs-track{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none;scroll-behavior:smooth}
.hs-track::-webkit-scrollbar{display:none}
.hs-track>*{flex:none}
.hs-btn{position:absolute;top:50%;z-index:2;width:30px;height:30px;margin-top:-17px;border-radius:50%;border:1px solid var(--ln);background:var(--s1);display:grid;place-items:center;padding:0;box-shadow:0 2px 10px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.hs-btn svg{width:14px;height:14px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hs-btn.l{left:6px}.hs-btn.r{right:6px}
.hs.can-l .hs-btn.l,.hs.can-r .hs-btn.r{opacity:1;pointer-events:auto}
.hs::before,.hs::after{content:"";position:absolute;top:0;bottom:0;width:44px;z-index:1;pointer-events:none;opacity:0;transition:opacity .2s}
.hs::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.hs::after{right:0;background:linear-gradient(270deg,var(--bg),transparent)}
.sheet .hs::before{background:linear-gradient(90deg,var(--s1),transparent)}.sheet .hs::after{background:linear-gradient(270deg,var(--s1),transparent)}
.hs.can-l::before,.hs.can-r::after{opacity:1}
.kinds.hs{margin:6px -16px 10px}
/* загрузка поиска */
.counts{display:flex;justify-content:center;gap:18px;margin-top:4px;font-variant-numeric:tabular-nums}
.counts span{color:var(--mu)}.counts b{color:var(--tx);font-weight:650}

.count-tip{margin:8px 2px 0;font-size:12.5px;line-height:1.45;color:var(--mu);opacity:.75}
.loadnote{max-width:310px;margin:12px auto 0;line-height:1.5}
.qbtn{display:inline-grid;place-items:center;width:20px;height:20px;margin-left:6px;padding:0;vertical-align:-5px;border-radius:50%;border:1px solid var(--ln);background:transparent;color:var(--mu);font-size:12px;font-weight:600;line-height:1}

/* скрипт: нажми, чтобы скопировать */

/* админка */
.ulist{margin-top:12px}
.ulist .usr:first-child{border-top:0;padding-top:0}
.urow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.urow button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--ln);background:var(--s1);color:var(--tx);font-size:14px;font-weight:600;line-height:1;white-space:nowrap}

.urow button.main{background:var(--tx);color:var(--inv);border-color:var(--tx)}
.urow .danger{color:#e5484d;border-color:color-mix(in srgb,#e5484d 45%,var(--ln))}
.atabs-grid{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px}
.atabs-grid .chip{padding:9px 14px}
@media(hover:hover){
.urow button:not(.main):not(.danger):hover{background:var(--s2);border-color:var(--mu)}
.urow button.main:hover{opacity:.88}
.urow .danger:hover{background:color-mix(in srgb,#e5484d 12%,var(--s1));border-color:#e5484d}}
.mem{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}
.mem:first-child{border-top:0}
.mem div{flex:1;min-width:0}.mem b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--mu);opacity:.5}.dot.on{background:#3fb950;opacity:1}
.rte{display:grid;gap:8px}
.rte-bar{display:flex;gap:6px;flex-wrap:wrap}

.rte-ed:focus{border-color:var(--tx)}
.rte-ed:empty::before{content:attr(data-ph);color:var(--mu)}

.rte-img button{position:absolute;top:6px;right:6px;width:26px;height:26px;padding:0;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
.rte-img .ic{width:13px;height:13px}
@media(hover:hover){.pick:hover{border-color:var(--mu)}.plist button:hover{color:var(--mu)}.hs-btn:hover,.rte-bar button:hover,.qbtn:hover{border-color:var(--mu);color:var(--tx)}.tapcopy:hover{border-color:var(--mu)}}
#pre{cursor:pointer;-webkit-user-select:none;user-select:none}
#pre.idle b{display:none}
#pre .tap{font-size:15px;font-weight:300;letter-spacing:.28em;text-transform:lowercase;color:var(--tx);animation:tap 1.6s ease-in-out infinite;padding-left:.28em}
#pre:not(.idle) .tap{display:none}
@keyframes tap{0%,100%{opacity:.35;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
#pre .pb{transition:transform .25s}
@media(hover:hover){#pre.idle:hover .pb{transform:scale(1.04)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Script C&C: новые элементы */
.hero{display:grid;gap:10px;margin:14px 0}
.big{width:100%;display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;border:1px solid var(--ln);background:var(--s1);text-align:left}
.big .bi{flex:none;width:44px;height:44px;border-radius:14px;background:var(--s2);display:grid;place-items:center}
.big .bi .ic{width:22px;height:22px}
.big b{display:block;font-size:16px;font-weight:650}
.big small{display:block;margin-top:2px;color:var(--mu);font-size:13px;line-height:1.35}
.big .chev{flex:none;width:18px;height:18px;margin-left:auto;color:var(--mu)}
.big.main{background:var(--tx);color:var(--inv);border-color:var(--tx)}
.big.main .bi{background:color-mix(in srgb,var(--inv) 16%,transparent)}
.big.main small,.big.main .chev{color:color-mix(in srgb,var(--inv) 70%,transparent)}
@media(hover:hover){.big:not(.main):hover{background:var(--s2);border-color:var(--mu)}.big.main:hover{opacity:.92}}
.lock{display:inline-flex;align-items:center;gap:5px}
.lock .ic{width:13px;height:13px}
.scr.locked .scr-text{filter:blur(3.5px);user-select:none}
.scr.locked .scr-text.clamp{-webkit-line-clamp:2}
.lockbar{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--mu)}
.lockbar .ic{width:16px;height:16px;flex:none}
.seg.three button,.seg.four button{font-size:13px}
.field{display:grid;gap:6px;margin:12px 0 0}
.field>span{font-size:13px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.count{display:flex;justify-content:flex-end;font-size:12px;color:var(--mu);margin-top:4px}
.result-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 8px}
.src{font-size:12px;color:var(--mu)}
.tools button.danger{color:#e5484d;border-color:color-mix(in srgb,#e5484d 45%,var(--ln))}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.mini-stats .card{margin:0;padding:12px 10px;text-align:center}
.mini-stats b{display:block;font-size:22px;margin-top:2px}
.mini-stats small{color:var(--mu);font-size:12px}
.bars{display:flex;align-items:flex-end;gap:6px;height:84px;margin-top:8px}
.bars div{flex:1;display:grid;justify-items:center;align-content:end;gap:4px;height:100%}
.bars i{display:block;width:100%;min-height:3px;border-radius:6px 6px 3px 3px;background:var(--tx);transform-origin:bottom;animation:grow2 .8s cubic-bezier(.2,.8,.2,1) both}
.bars span{font-size:10.5px;color:var(--mu)}
@keyframes grow2{from{transform:scaleY(0)}}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--tx)}
.chk input{width:20px;height:20px;padding:0;accent-color:var(--tx)}
.req{padding:10px 0;border-top:1px solid var(--ln);font-size:13px}.req:first-of-type{border-top:0;padding-top:0}
</style>

<script>
(function () {
  var pre = document.getElementById("pre"), fill = document.getElementById("pre-fill"), num = document.getElementById("pre-num");
  var ready = false, started = false, finished = false;
  window.__appReady = function () { ready = true; };
  pre.classList.add("idle");
  pre.setAttribute("aria-label", "Нажмите, чтобы запустить демо");
  var tap = document.createElement("span"); tap.className = "tap"; tap.textContent = "жми жми"; pre.appendChild(tap);
  function ease(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function run() {
    if (started) return;
    started = true;
    pre.classList.remove("idle");
    var duration = 2600 + Math.random() * 700, start = performance.now();
    (function frame(now) {
      var t = Math.min(1, (now - start) / duration);
      var value = Math.floor(ease(t) * 100);
      if (t >= 1) value = ready ? 100 : 99;
      fill.style.transform = "translateY(" + (100 - value) + "%)";
      num.textContent = value + "%";
      if (value === 100 && !finished) {
        finished = true;
        setTimeout(function () { pre.classList.add("out"); setTimeout(function () { if (pre.parentNode) pre.parentNode.removeChild(pre); }, 700); }, 180);
        return;
      }
      requestAnimationFrame(frame);
    })(start);
  }
  pre.addEventListener("click", run);
  pre.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") run(); });
  pre.tabIndex = 0;
})();
</script>

ает)\nВы: Понял(а). Могу коротко показать, как это можно улучшить. Удобнее в мессенджере или созвониться на 10 минут?\n\nЕсли отказ: Понимаю, спасибо за время. Можно я пришлю короткое сообщение, а вы посмотрите, когда будет удобно?", "followup": "{hi} Писал(а) вам на днях по поводу [что вы предлагаете] для «{niche}». Понимаю, что сообщений много, поэтому напомню коротко и без давления.\n\nЕсли актуально — отвечу на вопросы и предложу следующий шаг. {close}\n\nКак вам удобнее?", "objection": "Понимаю вас, [Имя], это нормальное сомнение.\n\nДавайте уточню, что именно смущает — условия, сроки или результат? Так я смогу предложить вариант именно под вашу ситуацию в сфере «{niche}», а не общий ответ.\n\nЧто для вас сейчас главное в этом решении?", "offer": "{hi} Как договаривались, коротко о предложении для [Название]:\n\n1. Задача: [что хочет клиент].\n2. Что я сделаю: [перечень работ].\n3. Результат для вас: [что получит клиент] — без громких обещаний, только то, что в моей зоне ответственности.\n4. Сроки и стоимость: [сроки], [стоимость].\n\nЕсли всё понятно, могу ответить на вопросы. Какой пункт обсудим подробнее?", "close": "{hi} Рад(а), что мы обо всём договорились по [что вы предлагаете].\n\nЧтобы начать, нужно три шага: 1) подтвердить условия, 2) [оплата или предоплата], 3) прислать материалы. После этого я приступаю и держу вас в курсе на каждом этапе.\n\nПодтверждаете условия? Тогда сразу отправлю реквизиты.", "reactivate": "{hi} Это [Ваше имя]. Мы с вами уже общались по поводу [что обсуждали], и я подумал(а) о вас.\n\nС тех пор я [что нового появилось: новые услуги, подход], и это может пригодиться «{niche}».\n\nИнтересно, актуальна ли для вас эта тема сейчас? {close}", "review": "{hi} Спасибо, что работали со мной над [проект]. Мне важно ваше мнение.\n\nЕсли у вас есть пара минут, оставьте, пожалуйста, короткий отзыв: что было полезно и что можно улучшить. Это помогает мне становиться лучше, а другим клиентам — принимать решение.\n\nУдобно написать отзыв здесь, в чате?"}, "greetings": ["Здравствуйте, [Имя]!", "Добрый день, [Имя]!", "Приветствую, [Имя]!", "[Имя], добрый день!"], "closers": ["Если сейчас не актуально — просто скажите, не буду отвлекать.", "Если неудобно сейчас, подскажите, когда лучше написать.", "Если тема не ваша — ответьте «не сейчас», и я не побеспокою."], "library": [{"category": "first", "free": 1, "title": "Знакомство: коротко и по делу", "body": "Здравствуйте, [Имя]! Меня зовут [Ваше имя], я помогаю компаниям вроде [Название] привлекать больше клиентов через [что вы предлагаете: сайт, бот, рекламу, контент].\n\nЗаметил(а), что [что вы увидели: нет онлайн-записи / сайт неудобно открывается с телефона / соцсети давно не обновлялись]. Это можно исправить без сложностей.\n\nМогу прислать пару конкретных идей — это займёт минуту. Прислать?"}, {"category": "first", "title": "Через наблюдение и пользу", "body": "[Имя], добрый день! Увидел(а) [Название] и подумал(а), что вам может пригодиться вот что: [одна конкретная идея, которую вы заметили].\n\nЯ занимаюсь [чем вы занимаетесь], поэтому сразу вижу такие вещи. Если интересно, расскажу, как это обычно решается и сколько времени занимает.\n\nРассказать подробнее?"}, {"category": "first", "title": "Для директа в Instagram", "body": "Привет, [Имя]! Классный аккаунт у [Название] — особенно понравилось [что именно].\n\nЯ помогаю бизнесам [что вы предлагаете], чтобы заявок из соцсетей было больше. Если вам это сейчас интересно, могу сделать небольшой разбор вашего профиля бесплатно.\n\nСделать?"}, {"category": "first", "title": "По рекомендации или общему контакту", "body": "Здравствуйте, [Имя]! Меня зовут [Ваше имя]. Мне вас посоветовал(а) [кто рекомендовал], сказал(а), что вы ищете [что ищет клиент].\n\nЯ занимаюсь [чем вы занимаетесь]. Давайте коротко обсудим вашу задачу — 10 минут по телефону или в переписке, как удобнее?"}, {"category": "call", "title": "Холодный звонок: структура разговора", "body": "Вы: Здравствуйте! Меня зовут [Ваше имя]. Это [Имя]? У вас есть минута?\nКлиент: Слушаю.\nВы: Я помогаю компаниям [ниша] [что вы предлагаете]. Звоню, потому что увидел(а) у [Название] [что вы заметили]. Подскажите, как к вам сейчас приходят новые клиенты?\nКлиент: (рассказывает)\nВы: Понял(а), спасибо. Могу коротко показать, как это можно улучшить. Удобнее в мессенджере или созвониться на 10 минут?\n\nЕсли отказ: Понимаю, спасибо за время. Можно пришлю короткое сообщение, а вы посмотрите, когда будет удобно?"}, {"category": "call", "title": "Звонок администратору или секретарю", "body": "Вы: Здравствуйте! Подскажите, пожалуйста, с кем можно обсудить [тема: сайт, реклама, автоматизация записи]?\nСекретарь: А по какому вопросу?\nВы: Я [Ваше имя], хочу предложить [Название] идею, как [польза для бизнеса]. Это займёт пару минут. Как зовут человека, который этим занимается?\nСекретарь: (называет)\nВы: Спасибо! Когда ему или ей удобнее принять звонок? Или лучше отправить информацию на почту или в мессенджер?"}, {"category": "call", "title": "Звонок по заявке", "body": "Вы: Здравствуйте, [Имя]! Это [Ваше имя]. Вы оставляли заявку на [что]. Вам сейчас удобно говорить?\nКлиент: Да.\nВы: Отлично. Чтобы сделать предложение точнее, уточню пару вопросов: какая у вас задача и к какому сроку вы хотите результат?\nКлиент: (отвечает)\nВы: Поняла, спасибо. Подготовлю предложение и пришлю [сегодня / завтра]. Куда удобнее — в Telegram или на почту?"}, {"category": "call", "title": "Назначить встречу или созвон", "body": "Вы: [Имя], чтобы не отнимать время сейчас, предлагаю созвониться на 15 минут и разобрать вашу задачу. Мне удобно [день и время] или [другой вариант]. Что подойдёт?\nКлиент: (выбирает)\nВы: Договорились. Отправлю приглашение в мессенджер и напомню за час. Нужно ли что-то подготовить заранее? Достаточно, чтобы вы коротко описали, что хотите получить."}, {"category": "followup", "free": 1, "title": "Мягкое напоминание через 2–3 дня", "body": "[Имя], добрый день! Писал(а) вам [когда] по поводу [тема]. Понимаю, что сообщений много, поэтому напомню коротко.\n\nЕсли тема актуальна, отвечу на вопросы и предложу следующий шаг. Если нет — просто скажите, не буду отвлекать.\n\nКак вам удобнее?"}, {"category": "followup", "title": "Повторное с новой пользой", "body": "[Имя], здравствуйте! После нашего прошлого разговора нашёл(ла) материал, который может пригодиться: [ссылка или короткая идея].\n\nДумаю, это поможет в [задача клиента]. Если хотите, разберу, как применить это именно у вас. Интересно?"}, {"category": "followup", "title": "Последнее сообщение: закрываем вопрос", "body": "[Имя], я не хочу быть навязчивым(ой), поэтому это моё последнее сообщение по теме [тема].\n\nЕсли сейчас не до этого — всё в порядке, можно вернуться к разговору в любой момент, мои контакты у вас есть. Если всё же актуально, напишите «да», и я пришлю детали.\n\nВсего доброго!"}, {"category": "followup", "title": "После отправки предложения", "body": "[Имя], здравствуйте! Хотел(а) уточнить, получилось ли посмотреть предложение, которое я отправил(а) [когда].\n\nЕсли есть вопросы по цене, срокам или составу работ — отвечу сразу. Могу также скорректировать предложение под ваш бюджет или задачи.\n\nЧто скажете?"}, {"category": "objection", "free": 1, "title": "«Дорого»", "body": "Понимаю, [Имя]. Давайте разберёмся, с чем вы сравниваете: с другим исполнителем, с бюджетом или с тем, что вы ожидали увидеть?\n\nЕсли дело в бюджете, могу предложить урезанный вариант: сначала самое важное, остальное позже. Если в сравнении с другими — расскажу, что именно входит в мою цену и чем она отличается.\n\nЧто из этого ближе к вашей ситуации?"}, {"category": "objection", "title": "«Мне надо подумать»", "body": "Конечно, решение важное, и спешить не нужно.\n\nЧтобы вам было проще, подскажите: что именно хочется обдумать — условия, сроки или результат? Возможно, я смогу сразу прояснить этот момент и вы примете решение быстрее.\n\nКогда мне вернуться к вам за ответом — завтра или через пару дней?"}, {"category": "objection", "title": "«У нас уже есть исполнитель»", "body": "Это хорошо, значит, вы понимаете ценность такой работы. Я не предлагаю менять того, кто вас устраивает.\n\nЕсли интересно, могу сделать небольшой независимый взгляд: показать пару идей, которые можно добавить к тому, что есть сейчас. Без обязательств.\n\nПоказать?"}, {"category": "objection", "title": "«Сейчас не до этого» или «Нам не нужно»", "body": "Понимаю, у всех сейчас много задач. Спасибо, что ответили честно.\n\nДавайте так: я оставлю свои контакты, а вы вернётесь, когда появится время. Скажите, что для вас было бы поводом вернуться к этому вопросу?"}, {"category": "offer", "title": "Структура коммерческого предложения", "body": "Здравствуйте, [Имя]! Как договаривались, отправляю предложение для [Название].\n\n1. Ваша задача: [что хочет клиент].\n2. Что я сделаю: [перечень работ].\n3. Что вы получите: [результат, без громких обещаний].\n4. Сроки: [сроки].\n5. Стоимость: [стоимость и что в неё входит].\n\nГотов(а) ответить на вопросы. Какой пункт обсудим первым?"}, {"category": "offer", "title": "Короткое предложение в мессенджере", "body": "[Имя], по нашему разговору предлагаю так: [что делаем] за [стоимость], срок — [срок]. В стоимость входит [что входит], дополнительно оплачивается [что нет].\n\nЕсли подходит, вышлю договор и реквизиты. Если хотите что-то изменить, скажите — подстроим."}, {"category": "offer", "title": "Презентация на созвоне: 5 шагов", "body": "1. Вернуться к задаче: «Вы говорили, что вам важно [задача]. Верно?»\n2. Показать решение: «Я предлагаю [решение], и вот как это работает: [объяснение].»\n3. Показать пример: «Вот похожая работа: [пример из вашего портфолио].»\n4. Назвать условия: сроки, стоимость, что нужно от клиента.\n5. Спросить: «Что из этого вам подходит, а что хотелось бы изменить?»\n\nНе перебивайте паузу после вопроса — дайте клиенту ответить."}, {"category": "offer", "title": "Три варианта пакетов", "body": "[Имя], чтобы вам было удобно выбрать, подготовил(а) три варианта:\n\nБазовый: [что входит] — подходит, если нужно просто начать.\nОптимальный: [что входит] — для тех, кто хочет заметный результат без лишнего.\nРасширенный: [что входит] — если нужно решение «под ключ».\n\nЦены: [цена 1], [цена 2], [цена 3]. Какой из вариантов ближе к вашей задаче?"}, {"category": "close", "title": "Договориться об оплате и старте", "body": "[Имя], рад(а), что мы обо всём договорились.\n\nЧтобы начать, нужны три шага: 1) подтвердить условия, 2) [предоплата или оплата], 3) прислать материалы [какие]. После этого я приступаю и держу вас в курсе по ходу работы.\n\nПодтверждаете условия? Тогда сразу отправлю реквизиты."}, {"category": "close", "title": "Подтвердить сделку и следующие шаги", "body": "Спасибо за доверие, [Имя]! Фиксирую, что мы договорились о [что] за [стоимость] со сроком [срок].\n\nДальше: [шаг 1], [шаг 2], [шаг 3]. Если что-то изменится, дам знать сразу.\n\nВсё верно? Если да, приступаю."}, {"category": "close", "title": "Мягко подтолкнуть к решению", "body": "[Имя], мы с вами обсудили [что обсуждали], и мне кажется, что остаётся принять решение.\n\nЕсли остались сомнения, давайте их проговорим сейчас. Если нет, предлагаю назначить старт на [дата], чтобы успеть к [событие или срок клиента].\n\nЧто вам нужно, чтобы сказать «да»?"}, {"category": "close", "title": "Как объяснить предоплату", "body": "Предоплата нужна, чтобы я мог(ла) зарезервировать время под ваш проект и начать работу. Это стандартная практика: вы платите [процент или сумма] сейчас, остаток — после [этапа].\n\nУсловия будут прописаны в договоре, чтобы вам было спокойно. Отправить договор и реквизиты?"}, {"category": "reactivate", "title": "Вернуть бывшего клиента", "body": "[Имя], здравствуйте! Это [Ваше имя]. Мы работали над [проект] в [когда].\n\nС тех пор у меня появилось [что нового: новые услуги, подход, портфолио], и я подумал(а), что вам это может пригодиться. Как у вас дела с [сфера клиента]? Есть ли задачи, в которых я могу помочь?"}, {"category": "reactivate", "title": "Клиент пропал после общения", "body": "[Имя], добрый день! Мы недавно обсуждали [тема], потом наступила тишина. Если планы поменялись, это абсолютно нормально.\n\nПодскажите, пожалуйста, тема всё ещё актуальна? Если нужно подождать, я вернусь позже, а если нет — не буду беспокоить."}, {"category": "reactivate", "title": "Спросить обратную связь после проекта", "body": "[Имя], здравствуйте! Прошло [срок] после завершения [проект]. Хочу узнать, как всё работает у вас, и есть ли что-то, что можно улучшить.\n\nВаша обратная связь для меня очень ценна. Удобно ответить на два вопроса: что получилось лучше всего и что хотелось бы доработать?"}, {"category": "reactivate", "title": "Предложить новую услугу прошлому клиенту", "body": "[Имя], добрый день! Раз [проект] у вас работает, возможно, вам пригодится следующий шаг: [новая услуга].\n\nОна подходит для [кому и зачем]. Могу коротко рассказать, что это даст именно вам. Если не актуально, ничего страшного. Рассказать?"}, {"category": "review", "title": "Попросить отзыв", "body": "[Имя], здравствуйте! Спасибо за совместную работу над [проект]. Мне важно ваше мнение.\n\nЕсли найдётся пара минут, оставьте, пожалуйста, короткий отзыв: что было полезно и что можно улучшить. Это помогает мне развиваться, а другим клиентам — выбирать.\n\nУдобно написать прямо здесь, в чате?"}, {"category": "review", "title": "Попросить рекомендацию", "body": "[Имя], рад(а), что результат вас устроил! Если у вас есть знакомые или коллеги, которым нужна похожая работа, буду благодарен(на) за рекомендацию.\n\nМожно просто переслать им мои контакты или познакомить нас в чате. Спасибо!"}, {"category": "review", "title": "Разрешение показать кейс", "body": "[Имя], мне очень понравилось работать над [проект], и результат получился достойным. Можно ли показать эту работу в моём портфолио и коротко рассказать о ней?\n\nНазвание компании и детали покажу только в том виде, который вы одобрите. Как вам удобнее: с названием или без?"}, {"category": "review", "title": "Напомнить об отзыве", "body": "[Имя], добрый день! Напоминаю о просьбе по отзыву на [проект]. Понимаю, что времени мало, поэтому достаточно двух-трёх предложений.\n\nЕсли неудобно писать самим, ответьте на два вопроса в чате, а я оформлю текст — вы только одобрите. Подойдёт?"}]};</script>
<script>
(function () {
  "use strict";
  var D = window.__SDEMO;
  var now = function () { return Math.floor(Date.now() / 1000); };
  var M = { used: 0, saved: [], nextId: 1, generated: 0 };
  var TRIAL = D.trialTotal;
  function left() { return Math.max(0, TRIAL - M.used); }
  function access() {
    var a = { plan: "trial", trial_total: TRIAL, join: D.join, contact: D.contact, left: left(), trial_over: left() <= 0 };
    if (left() <= 0) a.trial_message = D.trialOver;
    return a;
  }
  function ok(b) { return { status: 200, body: b }; }
  function err(s, d) { return { status: s, body: { detail: d } }; }
  function clean(v, n) { return String(v || "").replace(/[\x00-\x1f]/g, " ").replace(/[ \t]+/g, " ").trim().slice(0, n); }
  function template(niche, purpose, variant) {
    var base = D.templates[purpose] || D.templates.first;
    var hi = variant ? D.greetings[variant % D.greetings.length] : D.greetings[0];
    var close = D.closers[(variant * 2 + purpose.length) % D.closers.length];
    var hiCall = ["Здравствуйте!", "Добрый день!"][variant % 2];
    return base.replace(/\{hi\}/g, hi).replace(/\{hi_call\}/g, hiCall).replace(/\{close\}/g, close)
      .replace(/\{niche\}/g, clean(niche, 60) || "вашей сфере");
  }
  function title(purpose, niche) {
    var t = (D.purposes.filter(function (p) { return p.id === purpose; })[0] || D.purposes[0]).title;
    niche = clean(niche, 40);
    return (niche ? t + " — " + niche : t).slice(0, 80);
  }
  function route(method, path, body) {
    var p = path.split("?")[0];
    if (p === "/api/me") {
      return ok({ id: 1, name: "Гость", username: "guest", is_admin: false, access: access(),
        stats: { generated: M.generated, week: M.generated, saved: M.saved.length }, ai: true,
        purposes: D.purposes, channels: D.channels, tones: D.tones, niche_hints: D.hints });
    }
    if (p === "/api/library") {
      return ok({ items: D.library.map(function (it, i) {
        var locked = !it.free;
        return { id: i + 1, category: it.category, title: it.title, free: !!it.free, locked: locked,
          body: locked ? it.body.slice(0, D.preview).replace(/\s+$/, "") + "…" : it.body };
      }) });
    }
    if (p === "/api/generate") {
      var niche = clean(body.niche, 80), details = clean(body.details, 700);
      if (niche.length < 2 && details.length < 8) return err(422, "Напишите нишу или коротко опишите, какой скрипт нужен.");
      if (left() <= 0) return err(403, { code: "trial_over", message: D.trialOver, join: D.join, contact: D.contact });
      M.used += 1; M.generated += 1;
      var purpose = D.templates[body.purpose] ? body.purpose : "first";

function shrinkImage(file) {

      var canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", 0.86));
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

/* Текст редактора → HTML для Telegram: только <b> <i> <u> <s>, переносы строк. */
function editorToTelegram(node) {
  var out = "";
  node.childNodes.forEach(function (child) {
    if (child.nodeType === 3) { out += child.nodeValue.replace(/\u00a0/g, " "); return; }
    if (child.nodeType !== 1) return;
    var tag = child.tagName.toLowerCase();
    if (tag === "br") { out += "\n"; return; }
    var inner = editorToTelegram(child);
    var style = child.style || {};
    var deco = String(style.textDecorationLine || style.textDecoration || "");
    var weight = String(style.fontWeight || "");
    if (tag === "b" || tag === "strong" || weight === "bold" || Number(weight) >= 600) inner = "<b>" + inner + "</b>";
    if (tag === "i" || tag === "em" || style.fontStyle === "italic") inner = "<i>" + inner + "</i>";
    if (tag === "u" || deco.indexOf("underline") >= 0) inner = "<u>" + inner + "</u>";
    if (tag === "s" || tag === "strike" || tag === "del" || deco.indexOf("line-through") >= 0) inner = "<s>" + inner + "</s>";
    if ((tag === "div" || tag === "p") && out && !/\n$/.test(out)) out += "\n";
    out += inner;
  });
  return out;
}

function plural(n, one, few, many) {
  var mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return one;
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
  return many;
}

function stopGenLoop() {
  if (S.genLoop) clearInterval(S.genLoop);
  S.genLoop = null;
}

function startGenLoop() {
  stopGenLoop();
  var last = performance.now();
  var tipAt = last;
  var finished = false;
  S.genLoop = setInterval(function () {
    var now = performance.now();
    var dt = Math.min(200, now - last);
    last = now;
    var ready = S.genDone && now >= S.genMinAt;
    if (ready) S.shown = Math.min(100, S.shown + dt * 0.12);
    else S.shown += (91 - S.shown) * 0.0016 * dt;
    if (now - tipAt > 3200) {
      tipAt = now;
      var tip = $("#ptip");
      if (tip) {
        tip.classList.add("fade");
        setTimeout(function () {
          S.tipIndex = (S.tipIndex + 1) % TIPS.length;
          var node = $("#ptip");
          if (node) { node.textContent = TIPS[S.tipIndex]; node.classList.remove("fade"); }
        }, 350);
      }
    }
    var bar = $("#pb");
    if (bar) bar.style.width = S.shown.toFixed(1) + "%";
    if (ready && !finished && S.shown >= 100) {
      finished = true;
      stopGenLoop();
      setTimeout(finishGen, 350);
    }
  }, 40);
}

function finishGen() {
  S.gen = S.genRes;
  S.genState = "result";
  S.genSaved = false;
  if (S.tab === "create") render();
}

function doGenerate(variant) {
  syncForm();
  var f = S.form;
  if (f.niche.trim().length < 2 && f.details.trim().length < 8) {
    toast("Напишите нишу или коротко опишите, какой скрипт нужен.");
    return;
  }
  if (!canGenerate()) { if (trialOver()) showOffer(S.access.trial_message); else toast("Дневной лимит исчерпан."); return; }
  S.genState = "loading";
  S.genDone = false;
  S.shown = 4;
  S.genVariant = variant || 0;
  S.genMinAt = performance.now() + 1800;
  render();
  startGenLoop();
  api("/api/generate", {
    method: "POST",
    body: JSON.stringify({ niche: f.niche, purpose: f.purpose, channel: f.channel, tone: f.tone, details: f.details, variant: S.genVariant })
  }).then(function (res) {
    S.access = res.access || S.access;
    S.genRes = res;
    S.stats.generated = (S.stats.generated || 0) + 1;
    S.stats.week = (S.stats.week || 0) + 1;
    S.genDone = true;
  }).catch(function (error) {
    stopGenLoop();
    S.genState = S.gen ? "result" : "form";
    var code = error.detail && error.detail.code;
    if (code === "trial_over") {
      S.access = Object.assign({}, S.access, { left: 0, trial_over: true, trial_message: error.detail.message });
      render();
      showOffer(error.detail.message);
      return;
    }
    if (S.tab === "create") render();
    toast(error.message);
  });
}

  };

}

function tiles(rows) {
  return '<div class="grid">' + rows.map(function (row) {
    return '<div class="card tile"><small class="muted">' + row[0] + '</small><b class="num" data-to="' + (row[1] || 0) + '">' + (row[1] || 0) + "</b></div>";
  }).join("") + "</div>";
}

function table2(rows, headers, nameFn) {
  if (!rows || !rows.length) return '<p class="muted">Пока нет данных.</p>';
  return '<div style="overflow-x:auto"><table class="tbl"><tr>' + headers.map(function (h) { return "<th>" + h + "</th>"; }).join("") + "</tr>" +
    rows.map(function (row) { return "<tr><td>" + esc(nameFn ? nameFn(row.name) : row.name) + "</td><td>" + esc(row.n) + "</td></tr>"; }).join("") +
    "</table></div>";
}

function last7(series) {
  var map = {};
  (series || []).forEach(function (row) { map[row.day] = row.n; });
  var days = [];
  for (var i = 6; i >= 0; i--) {
    var d = new Date(Date.now() - i * 86400000);
    var key = d.toISOString().slice(0, 10);
    days.push({ key: key, label: key.slice(8, 10) + "." + key.slice(5, 7), n: map[key] || 0 });
  }
  return days;
}

function adminOverview() {
  var o = S.overview;
  if (!o) return '<div class="dots"><i></i><i></i><i></i></div>';
  var days = last7(o.series);
  var max = Math.max(1, Math.max.apply(null, days.map(function (d) { return d.n; })));
  var aiLine = o.api.ai_enabled
    ? "Подключена. Сегодня запросов: " + o.api.ai_day + " из " + o.api.ai_limit + "."
    : "Не подключена: скрипты собираются из шаблона. Добавьте GEMINI_API_KEY в переменные сервера.";
  return tiles([["Пользователей", o.users.total], ["Участников", o.users.members], ["На пробе", (o.users.trial_used || 0) + (o.users.trial_left || 0)], ["Забанено", o.users.banned]]) +
    tiles([["Скриптов создано", o.gens.total], ["Сегодня", o.gens.today], ["За 7 дней", o.gens.week], ["Людей создавали", o.gens.people]]) +
    '<div class="card"><h3>Нейросеть</h3><p class="small">' + esc(aiLine) + '</p><p class="muted small">Нейросеть: ' + esc(o.gens.ai) + " · Шаблон: " + esc(o.gens.template) + "</p></div>" +
    '<div class="card"><h3>Последние 7 дней</h3><div class="bars">' + days.map(function (d) {
      return "<div><i style=\"height:" + Math.round(d.n / max * 100) + '%" title="' + d.n + '"></i><span>' + esc(d.label) + "</span></div>";
    }).join("") + "</div></div>" +
    '<div class="card"><h3>Для чего создают</h3>' + table2(o.purposes, ["Цель", "Раз"], function (name) { return (o.purpose_titles && o.purpose_titles[name]) || name; }) + "</div>" +

/* ---------- Отрисовка ---------- */

function render(keepScroll) {
  var oldScroll = window.scrollY;
  var views = { home: vHome, library: vLibrary, create: vCreate, saved: vSaved, faq: vFaq, admin: vAdmin };
  if (S.tab === "admin" && !S.admin) S.tab = "home";
  var strips = keepScroll ? saveStrips($("#app")) : {};
  $("#app").classList.toggle("still", Boolean(keepScroll));
  $("#app").innerHTML = views[S.tab]();
  restoreStrips(strips, $("#app"));
  $("#tabs").innerHTML = TABS.filter(function (tab) {
    return tab[0] !== "admin" || S.admin;
  }).map(function (tab) {
    return '<button class="' + (S.tab === tab[0] ? "on" : "") +
      '" data-act="tab" data-v="' + tab[0] + '">' + ic(tab[2]) + "<span>" + tab[1] + "</span></button>";
  }).join("");
  document.querySelectorAll(".num").forEach(function (element) {
    var value = Number(element.dataset.to) || 0;
    if (keepScroll) element.textContent = String(value);
    else countUp(element, value);
  });
  window.scrollTo(0, keepScroll ? oldScroll : 0);
}

function adminAction(path, body, message) {
  return api(path, { method: "POST", body: JSON.stringify(body) }).then(function (result) {
    return loadAdmin().then(function () {
      render(true);
      toast((result && result.message) || message);
    });
  }).catch(function (error) { toast(error.message); });
}

function findIn(list, id) {
  return list.filter(function (item) { return String(item.id) === String(id); })[0];
}

function openTab(value) {
  S.tab = value;
  if (value === "admin") {
    render();
    loadAdmin().then(function () { render(true); }).catch(function (error) { S.tab = "home"; render(); toast(error.message); });
  } else if (value === "library") {
    render();
    loadLibrary().then(function () { if (S.tab === "library") render(true); }).catch(function (error) { toast(error.message); });
  } else if (value === "saved") {
    render();
    loadSaved().then(function () { if (S.tab === "saved") render(true); }).catch(function (error) { toast(error.message); });
  } else if (value === "home") {
    render();
    loadMe().then(function () { if (S.tab === "home") render(true); }).catch(function () {});
  } else {
    render();
  }
}

function clickHandler(event) {
  var target = event.target;
  if (target.id === "sheet") { closeSheet(); return; }
  if (target.closest("[data-fmt]")) return;

  if (target.closest("#theme")) {
    hap();
    setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    return;
  }

  var link = target.closest(".ct a,.contact,a[data-ext]");
  if (link && tg) {
    if (/^https?:/.test(link.href)) {
      event.preventDefault();
      openLink(link.href);
    }
    return;
  }

  var stripButton = target.closest(".hs-btn");
  if (stripButton) {
    var track = stripButton.parentNode.querySelector(".hs-track");
    if (track) track.scrollBy({ left: Number(stripButton.dataset.hs) * Math.max(120, track.clientWidth * 0.7), behavior: "smooth" });
    return;
  }

  var button = target.closest("[data-act]");
  if (!button || button.disabled) return;
  hap();
  var action = button.dataset.act;
  var value = button.dataset.v;
  var id = button.dataset.id ? decodeURIComponent(button.dataset.id) : "";

  if (action === "tab") {
    openTab(value);
  } else if (action === "close") {
    closeSheet();
  } else if (action === "offer") {
    showOffer(S.access && S.access.trial_message);
  } else if (action === "libcat") {
    S.libCat = value;
    render(true);
  } else if (action === "lopen") {
    S.libOpen[id] = !S.libOpen[id];
    render(true);
  } else if (action === "lcopy") {
    var item = findIn(S.lib, id);
    if (item && !item.locked) copyText(item.body);
  } else if (action === "lsave") {
    var libItemData = findIn(S.lib, id);
    if (!libItemData || libItemData.locked) return;
    api("/api/saved", {
      method: "POST",
      body: JSON.stringify({ title: libItemData.title, body: libItemData.body, purpose: libItemData.category })
    }).then(function () { return loadSaved(); }).then(function () { toast("Сохранено во вкладке «Мои»."); })
      .catch(function (error) { toast(error.message); });
  } else if (action === "hint") {
    syncForm();
    S.form.niche = value;
    render(true);
  } else if (action === "purpose") {
    syncForm();
    S.form.purpose = value;
    render(true);
  } else if (action === "channel") {
    syncForm();
    S.form.channel = value;
    render(true);
  } else if (action === "tone") {
    syncForm();
    S.form.tone = value;
    render(true);
  } else if (action === "gen") {
    doGenerate(0);
  } else if (action === "genmore") {
    doGenerate((S.genVariant || 0) + 1);
  } else if (action === "editreq") {
    S.genState = "form";
    render();
  } else if (action === "copygen") {
    if (S.gen) copyText(S.gen.text);
  } else if (action === "savegen") {
    saveGenerated();
  } else if (action === "sopen") {
    S.savedOpen[id] = !S.savedOpen[id];
    render(true);
  } else if (action === "scopy") {
    var script = findIn(S.saved, id);
    if (script) copyText(script.body);
  } else if (action === "sedit") {
    S.savedEdit = Number(id);
    render(true);
  } else if (action === "scancel") {
    S.savedEdit = null;
    render(true);
  } else if (action === "sdel") {
    api("/api/saved/" + encodeURIComponent(id), { method: "DELETE" }).then(function () {
      return loadSaved();
    }).then(function () { render(true); toast("Скрипт удалён."); }).catch(function (error) { toast(error.message); });
  } else if (action === "atab") {
    S.atab = value;
    S.newKey = "";
    S.libNew = false;
    S.libEdit = null;
    render(true);
    loadAdmin().then(function () { render(true); }).catch(function (error) { toast(error.message); });
  } else if (action === "udelask") {
    S.delConfirm = Number(id);
    render(true);
    clearTimeout(S.delTimer);
    S.delTimer = setTimeout(function () { if (S.delConfirm === Number(id)) { S.delConfirm = null; if (S.tab === "admin") render(true); } }, 4000);
  } else if (action === "udel") {
    S.delConfirm = null;
    api("/api/admin/users/" + encodeURIComponent(id), { method: "DELETE" }).then(function () {
      return loadAdmin();
    }).then(function () { render(true); toast("Пользователь удалён и заблокирован в боте."); }).catch(function (error) { toast(error.message); });
  } else if (action === "bimg") {
    var file = $("#bc-file");
    if (file) file.click();
  } else if (action === "bimgdel") {
    S.bcImage = "";
    render(true);
  } else if (action === "edit") {
    var user = findIn(S.users, id);
    if (!user) return;
    S.editId = S.editId === user.id ? null : user.id;
    S.editVal = user.lim;
    render(true);
  } else if (action === "limd") {
    S.editVal = Math.max(0, Math.min(5000, S.editVal + Number(value)));
    render(true);
  } else if (action === "limset") {
    S.editVal = Number(value);
    render(true);
  } else if (action === "limcancel") {
    S.editId = null;
    render(true);
  } else if (action === "limsave") {
    var editId = S.editId;
    S.editId = null;
    adminAction("/api/admin/users/" + encodeURIComponent(editId) + "/limit", { limit: S.editVal }, "Лимит обновлён.");
  } else if (action === "access") {
    adminAction("/api/admin/users/" + encodeURIComponent(id) + "/access", { approved: value === "1" },
      value === "1" ? "Полный доступ выдан." : "Полный доступ закрыт.");
  } else if (action === "bonus") {
    adminAction("/api/admin/users/" + encodeURIComponent(id) + "/bonus", { amount: Number(value) }, "Генерации добавлены.");
  } else if (action === "ban") {
    adminAction("/api/admin/users/" + encodeURIComponent(id) + "/ban", { banned: value === "1" },
      value === "1" ? "Пользователь заблокирован." : "Пользователь разблокирован.");
  } else if (action === "copykey" || action === "copyval") {
    copyText(value);
  } else if (action === "delkey") {
    api("/api/admin/keys/" + encodeURIComponent(value), { method: "DELETE" }).then(function () {
      return loadAdmin();
    }).then(function () { render(true); toast("Ключ удалён."); }).catch(function (error) { toast(error.message); });
  } else if (action === "lnew") {
    S.libNew = !S.libNew;
    S.libEdit = null;
    render(true);
  } else if (action === "ledit") {
    S.libEdit = Number(id);
    S.libNew = false;
    render(true);
  } else if (action === "lcancel") {
    S.libEdit = null;
    S.libNew = false;
    render(true);
  } else if (action === "ldelask") {
    S.libDel = Number(id);
    render(true);
    clearTimeout(S.libDelTimer);
    S.libDelTimer = setTimeout(function () { if (S.libDel === Number(id)) { S.libDel = null; if (S.tab === "admin") render(true); } }, 4000);
  } else if (action === "ldel") {
    S.libDel = null;
    api("/api/admin/library/" + encodeURIComponent(id), { method: "DELETE" }).then(function () {
      return Promise.all([loadAdmin(), loadLibrary()]);
    }).then(function () { render(true); toast("Скрипт удалён из библиотеки."); }).catch(function (error) { toast(error.message); });
  } else if (action === "refresh") {
    refreshAll().then(function () { toast("Данные обновлены."); }).catch(function (error) { toast(error.message); });
  }
}

document.addEventListener("click", clickHandler);
document.addEventListener("input", function (event) {
  var id = event.target.id;
  if (id === "g-details") {
    S.form.details = event.target.value;
    var count = $("#g-count");
    if (count) count.textContent = event.target.value.length + "/700";
  }
  if (id === "g-niche") S.form.niche = event.target.value;
  if (id === "bc-ed") S.bcHtml = event.target.innerHTML;
  if (id === "mem-q" || id === "user-q") {
    if (id === "mem-q") S.memberQuery = event.target.value; else S.userQuery = event.target.value;
    var pos = event.target.selectionStart;
    render(true);
    var input = $("#" + id);
    if (input) { input.focus(); try { input.setSelectionRange(pos, pos); } catch (_) {} }
  }
});
document.addEventListener("change", function (event) {
  if (event.target.id === "bc-file") {
    var file = event.target.files && event.target.files[0];
    event.target.value = "";
    if (!file) return;
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) { toast("Нужна картинка JPG, PNG или WEBP."); return; }
    shrinkImage(file).then(function (dataUrl) {
      S.bcImage = dataUrl;
      var ed = $("#bc-ed");
      if (ed) S.bcHtml = ed.innerHTML;
      render(true);
    }).catch(function () { toast("Не удалось открыть картинку."); });
  }
});
document.addEventListener("toggle", function (event) {
  var key = event.target.dataset && event.target.dataset.intro;
  if (key) S.intro[key] = event.target.open;
}, true);
document.addEventListener("keydown", function (event) {
  if (event.key === "Escape" && $("#sheet").classList.contains("show")) closeSheet();
});

document.addEventListener("submit", function (event) {
  var form = event.target;
  var id = form.id;
  if (!id) return;
  event.preventDefault();
  if (id === "key-form") {
    var code = formValue(form, "code").toUpperCase();
    if (code.length < 4) { toast("Введите ключ доступа."); return; }
    api("/api/key", { method: "POST", body: JSON.stringify({ code: code }) }).then(function (result) {
      closeSheet();
      return loadMe().then(function () { return loadLibrary().catch(function () {}); }).then(function () { render(); toast(result.message || "Ключ активирован."); });
    }).catch(function (error) { toast(error.message); });
  } else if (id === "saved-form") {
    var payload = { title: formValue(form, "title"), body: formValue(form, "body") };
    if (!payload.title || !payload.body) { toast("Заполните название и текст."); return; }
    api("/api/saved/" + encodeURIComponent(form.dataset.id), { method: "PUT", body: JSON.stringify(payload) }).then(function () {
      S.savedEdit = null;
      return loadSaved().then(function () { render(true); toast("Скрипт сохранён."); });
    }).catch(function (error) { toast(error.message); });
  } else if (id === "lib-form") {
    var data = {
      category: formValue(form, "category"), title: formValue(form, "title"), body: formValue(form, "body"),
      free: Boolean(form.querySelector('input[name="free"]').checked)
    };
    if (!data.title || !data.body) { toast("Заполните название и текст."); return; }
    var editingId = form.dataset.id;
    api("/api/admin/library" + (editingId ? "/" + encodeURIComponent(editingId) : ""), {
      method: editingId ? "PUT" : "POST", body: JSON.stringify(data)
    }).then(function () {
      S.libNew = false;
      S.libEdit = null;
      return Promise.all([loadAdmin(), loadLibrary()]).then(function () { render(true); toast("Библиотека обновлена."); });
    }).catch(function (error) { toast(error.message); });
  } else if (id === "grant-form") {
    var limit = formValue(form, "limit");
    adminAction("/api/admin/grant", { query: formValue(form, "query"), limit: limit ? Number(limit) : null }, "Доступ выдан.");
  } else if (id === "key-create") {
    api("/api/admin/keys", {
      method: "POST",
      body: JSON.stringify({
        for_user: formValue(form, "for_user"), limit: Number(formValue(form, "limit") || 0),
        bonus: Number(formValue(form, "bonus") || 0), uses: Number(formValue(form, "uses") || 1), note: formValue(form, "note")
      })
    }).then(function (result) {
      S.newKey = result.code;
      return loadAdmin().then(function () { render(true); toast("Ключ создан."); });
    }).catch(function (error) { toast(error.message); });
  } else if (id === "broadcast-form") {
    var ed = $("#bc-ed");
    var text = ed ? editorToTelegram(ed).replace(/\n{3,}/g, "\n\n").trim() : "";
    if (!text && !S.bcImage) { toast("Добавьте текст или картинку."); return; }
    var sendButton = form.querySelector('button[type="submit"]');
    if (sendButton) sendButton.disabled = true;
    api("/api/admin/broadcast", { method: "POST", body: JSON.stringify({ text: text, image: S.bcImage || "" }) }).then(function (result) {
      S.bcHtml = "";
      S.bcImage = "";
      render(true);
      toast(result.message || "Рассылка запущена.");
    }).catch(function (error) {
      if (sendButton) sendButton.disabled = false;
      toast(error.message);
    });
  }
});

function boot() {
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (_) {}
    if (tg.colorScheme === "light") setTheme("light");
  }
  refreshAll().then(appReady).catch(function (error) {
    appReady();
    var app = $("#app");
    var banned = error.detail && error.detail.code === "banned";
    app.innerHTML = '<section class="screen"><div class="card"><h2>' + (banned ? "Доступ закрыт" : "Не удалось открыть приложение") + "</h2>" +
      '<p class="muted">' + esc(error.message) + '</p><p class="muted small">' +
      (banned ? "" : error.status === 401
        ? "Откройте Mini App через бота в Telegram. Если окно было открыто долго, закройте его и откройте снова."
        : "Проверьте соединение и снова откройте приложение.") +
      "</p>" + (banned ? "" : '<button class="ghost" data-act="refresh">Повторить</button>') + "</div></section>";
    $("#tabs").innerHTML = "";
  });
}

setTheme("dark");
render();
boot();

</script>
</body>
</html>
