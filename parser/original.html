<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#151619">
<title>Parser C&C</title>
<style>
:root{--bg:#151619;--s1:#1d1f23;--s2:#282a30;--ln:#33363c;--tx:#f3f3f4;--mu:#8d9097;--inv:#151619;--lf:none;color-scheme:dark}
[data-theme=light]{--bg:#f3f3f4;--s1:#fff;--s2:#ebebed;--ln:#dcdde0;--tx:#151619;--mu:#6d7077;--inv:#fff;--lf:invert(1);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,"Segoe UI",Roboto,Inter,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));transition:background .3s,color .3s}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:10px;font-weight:650}
.logo{width:26px;height:26px;filter:var(--lf)}
.logo.big{width:72px;height:72px}
.ic{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
button{font:inherit;color:inherit;cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .15s,opacity .2s}
button:active{transform:scale(.96)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--ln);background:var(--s1);display:grid;place-items:center}
main{padding:0 16px}
.screen{animation:in .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.hello{margin:18px 0 6px;font-size:22px;font-weight:650}
.hello small{display:block;font-size:14px;font-weight:400;color:var(--mu)}
h2{margin:18px 0 8px;font-size:22px}h2 small{color:var(--mu);font-size:15px;font-weight:400}
h3{margin:18px 0 8px;font-size:13px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.card h3{margin-top:0}
.muted{color:var(--mu)}.small{font-size:13px}p{margin:4px 0}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:14px 16px;margin:12px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row.g{margin:10px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.chip{flex:none;padding:9px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--s1)}
.chip.on,.seg .on,.st .on{background:var(--tx);color:var(--inv);border-color:var(--tx)}
input{width:100%;padding:13px 14px;background:var(--s1);border:1px solid var(--ln);border-radius:14px;color:var(--tx);font-size:16px;outline:0;transition:border-color .2s}
input:focus{border-color:var(--tx)}#cn{margin-top:10px}
.seg{display:flex;gap:4px;padding:4px;background:var(--s2);border-radius:14px}
.seg button{flex:1;padding:10px 4px;border:0;background:transparent;color:var(--mu);border-radius:10px}
.cta{width:100%;margin-top:20px;padding:15px;border:0;border-radius:16px;background:var(--tx);color:var(--inv);font-size:16px;font-weight:600}
.cta:disabled{opacity:.35}
.bar{height:6px;background:var(--s2);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--tx);border-radius:99px;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transition:width .3s}
@keyframes grow{from{transform:scaleX(0)}}
.bar.wide{width:240px;margin:14px auto}
.lead{animation:in .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(min(var(--i,0),10)*45ms)}
.hot{position:relative;min-width:44px;padding:3px 7px 4px;border-radius:9px;border:0;background:var(--s2);display:flex;flex-direction:column;align-items:center;line-height:1.1}
.hot b{font-size:12.5px}.hot small{margin-top:1px;font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.tip{position:absolute;right:0;top:calc(100% + 8px);width:220px;padding:10px 12px;border-radius:12px;background:var(--tx);color:var(--inv);font-size:12.5px;font-weight:400;line-height:1.35;letter-spacing:0;text-align:left;text-transform:none;opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .2s,transform .2s;z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.hot.open .tip{opacity:1;transform:none}
.pill{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill.none{background:var(--tx);color:var(--inv)}.pill.weak{border:1px solid var(--mu)}
.tel{display:inline-flex;align-items:center;gap:6px;color:var(--tx);text-decoration:none;font-size:14px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.st button{padding:9px 0;font-size:12.5px;border:1px solid var(--ln);background:transparent;color:var(--mu);border-radius:10px}
.top{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{margin:0}.tile b{display:block;font-size:30px;margin-top:4px}
.fn{display:grid;grid-template-columns:84px 1fr 40px;align-items:center;gap:10px;font-size:13px}
.fn em{font-style:normal;color:var(--mu);text-align:right}
.usr{padding:10px 0;border-top:1px solid var(--ln)}.usr:first-of-type{border:0;padding-top:0}
.ghost{flex:1;padding:13px;border:1px solid var(--ln);background:var(--s1);border-radius:14px;display:inline-flex;justify-content:center;align-items:center;gap:8px}
.center{display:grid;place-items:center;align-content:center;text-align:center;min-height:70vh;gap:6px}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1);opacity:.6}}
.empty{text-align:center;color:var(--mu);padding:60px 0}.empty .ic{width:36px;height:36px;opacity:.5}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--ln)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--mu);font-size:11px;padding:6px 0}
nav .on{color:var(--tx)}nav .on .ic{transform:translateY(-2px)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--tx);color:var(--inv);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ct{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.ct a{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border:1px solid var(--ln);border-radius:99px;background:var(--s2);color:var(--tx);text-decoration:none;font-size:12.5px;transition:transform .15s,background .2s}
.ct a:active{transform:scale(.95)}.ct a .ic{width:14px;height:14px}
.ct a.site{background:var(--tx);color:var(--inv);border-color:var(--tx);font-weight:600}
.cta{transition:box-shadow .25s,opacity .2s,transform .15s}.ct a{transition:transform .15s,background .2s,border-color .2s,opacity .2s}
@media(hover:hover){
.chip:hover:not(.on),.icon-btn:hover,.ghost:hover,.hot:hover{background:var(--s2);border-color:var(--mu)}
.chip.on:hover,.ct a.site:hover{opacity:.9}
.seg button:hover:not(.on){color:var(--tx);background:color-mix(in srgb,var(--tx) 7%,transparent)}
.st button:hover:not(.on){color:var(--tx);border-color:var(--mu);background:color-mix(in srgb,var(--tx) 6%,transparent)}
.ct a:not(.site):hover{border-color:var(--mu);background:color-mix(in srgb,var(--tx) 10%,var(--s2))}
.cta:hover:not(:disabled){box-shadow:0 0 0 4px color-mix(in srgb,var(--tx) 15%,transparent)}
nav button:hover{color:var(--tx)}.tel:hover{opacity:.7}.hot:hover .tip{opacity:1;transform:none}}
.edit{margin:10px 0 2px;padding:12px;border:1px solid var(--ln);border-radius:14px;background:var(--s2);animation:in .3s both}
.edit .chips{margin-top:10px}.edit .chip{background:var(--s1)}.edit .chip.on{background:var(--tx)}
.step{display:flex;gap:8px}.step button{width:34px;height:34px;border-radius:50%;border:1px solid var(--ln);background:var(--s1);font-size:18px;line-height:1}
.mini{padding:5px 10px;font-size:12px;display:inline-flex;align-items:center;gap:5px}.mini .ic{width:13px;height:13px}
.ghost.go{background:var(--tx);color:var(--inv);border-color:var(--tx);font-weight:600}
@media(hover:hover){.step button:hover{border-color:var(--mu)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const pb=$("#pb"),pt=$("#pt");let k=0;const t=setInterval(()=>{k+=Math.ceil(n/8)+1;const f=Math.min(n,Math.round(k*.8));pb.style.width=f/n*100+"%";pt.textContent=`Найдено ${f} из ${n} · проверено ${k}`;
if(f>=n){clearInterval(t);setTimeout(()=>{leads=gen(n).concat(leads);S.used+=n;S.tab="leads";S.filter="all";toast(`Найдено ${n} бизнесов`);render()},500)}},350)}

const dg=x=>String(x).replace(/\D/g,"");
function contacts(l){const c=l.c||{},a=[],t=' target="_blank" rel="noopener"';
if(l.url&&/^https?:\/\//.test(l.url))a.push(`<a class="site" href="${esc(l.url)}"${t}>${ic("link")}Сайт</a>`);
if(c.tg)a.push(`<a href="https://t.me/${esc(c.tg.replace("@",""))}"${t}>Telegram</a>`);
if(c.vk)a.push(`<a href="https://vk.com/${esc(c.vk)}"${t}>VK</a>`);
if(c.vkg)a.push(`<a href="https://vk.com/${esc(c.vkg)}"${t}>VK группа</a>`);
if(c.wa)a.push(`<a href="https://wa.me/${dg(c.wa)}"${t}>WhatsApp</a>`);
if(c.vb)a.push(`<a href="viber://chat?number=%2B${dg(c.vb)}">Viber</a>`);
return a.length?`<div class="ct">${a.join("")}</div>`:""}
const why=l=>{const r=l.reasons.filter(x=>x!="сайта нет");return r.length?`<p class="muted small">${r.map(esc).join(" · ")}</p>`:""};
function card(l,i){return `<article class="card lead" style="--i:${i}"><div class="row"><b>${esc(l.name)}</b><button class="hot" data-act="tip" aria-label="Шанс"><b>${l.hot}%</b><small>шанс</small><span class="tip">Оценка перспективности лида, а не гарантия сделки. Чем выше, тем сильнее бизнесу нужен сайт и тем проще с ним связаться.</span></button></div>
<p class="muted small">${l.country} · ${esc(l.city)}</p>
<div class="row g"><span class="pill ${l.site}">${l.site=="none"?"Сайта нет":"Слабый сайт"}</span><a class="tel" href="tel:${l.phone.replace(/\s/g,"")}">${ic("phone")}${esc(l.phone)}</a></div>
${contacts(l)}${why(l)}
<div class="st">${["written","replied","rejected","client"].map(s=>`<button class="${l.status==s?"on":""}" data-act="st" data-id="${l.id}" data-v="${s}">${ST[s]}</button>`).join("")}</div></article>`}
function vLeads(){const list=leads.filter(l=>S.filter=="all"||l.status==S.filter);
return `<section class="screen"><div class="top"><h2>Лиды <small>${leads.length}</small></h2><button class="icon-btn" data-act="toast" data-v="Excel-файл придёт в чат с ботом">${ic("download")}</button></div>
<div class="chips scroll">${FL.map(([k,n])=>`<button class="chip ${S.filter==k?"on":""}" data-act="filter" data-v="${k}">${n}</button>`).join("")}</div>
${list.length?list.map(card).join(""):`<div class="empty">${ic("list")}<p>Здесь пока пусто</p></div>`}</section>`}

function vStats(){const c=leads.length,w=leads.filter(l=>l.status!="new").length,r=leads.filter(l=>["replied","client"].includes(l.status)).length,k=leads.filter(l=>l.status=="client").length;
const p=(a,b)=>b?Math.round(a/b*100):0,rows=[["Найдено",c],["Связались",w],["Ответили",r],["Клиенты",k]];
return `<section class="screen"><h2>Статистика</h2><div class="grid">${rows.map(([n,v])=>`<div class="card tile"><small class="muted">${n}</small><b class="num" data-to="${v}">0</b></div>`).join("")}</div>
<div class="card"><h3>Воронка</h3>${rows.map(([n,v])=>`<div class="fn"><span>${n}</span><div class="bar"><i style="width:${p(v,c)}%"></i></div><em>${p(v,c)}%</em></div>`).join("")}</div>
<div class="card"><div class="row"><span>Ответили от найденных</span><b>${p(r,c)}%</b></div><div class="row g"><span>Клиенты от найденных</span><b>${p(k,c)}%</b></div></div></section>`}

function userRow(u,i){const ed=S.edit===i;
return `<div class="usr"><div class="row"><b>${u.n}</b><span class="muted small">сегодня ${u.t}/${u.lim}</span></div><div class="bar"><i style="width:${Math.min(100,u.t/u.lim*100)}%"></i></div>
<div class="row"><p class="muted small">найдено ${u.f} · ответили ${u.r} · клиенты ${u.k} · конв. ${u.f?Math.round(u.k/u.f*100):0}%</p><button class="chip mini ${ed?"on":""}" data-act="edit" data-v="${i}">${ic("edit")}Лимит</button></div>
${ed?`<div class="edit"><div class="row"><span class="muted small">Дневной лимит: <b>${S.editVal}</b></span><div class="step"><button data-act="limd" data-v="-10" aria-label="Меньше">−</button><button data-act="limd" data-v="10" aria-label="Больше">+</button></div></div>
<div class="chips">${[70,100,150,200].map(n=>`<button class="chip ${S.editVal==n?"on":""}" data-act="limset" data-v="${n}">${n}</button>`).join("")}</div>
<div class="row g"><button class="ghost" data-act="limcancel">Отмена</button><button class="ghost go" data-act="limsave">Сохранить</button></div></div>`:""}</div>`}
function vAdmin(){const f=USERS.reduce((a,u)=>a+u.f,0),k=USERS.reduce((a,u)=>a+u.k,0),act=USERS.filter(u=>u.t>0).length;
return `<section class="screen"><h2>Админ-панель</h2><div class="grid">${[["Участников",USERS.length],["Активны сегодня",act],["Лидов найдено",f],["Клиентов",k]].map(([n,v])=>`<div class="card tile"><small class="muted">${n}</small><b class="num" data-to="${v}">0</b></div>`).join("")}</div>
<div class="card"><h3>Участники</h3>${USERS.map(userRow).join("")}</div>
<div class="row"><button class="ghost" data-act="toast" data-v="Добавить: команда /adduser ID в чате бота">${ic("plus")}Участник</button><button class="ghost" data-act="toast" data-v="Рассылка: команда /broadcast в чате бота">${ic("send")}Рассылка</button></div></section>`}

function countUp(e,to){const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/700);e.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}
function render(keep){const y=scrollY;$("#app").innerHTML=({search:vSearch,leads:vLeads,stats:vStats,admin:vAdmin})[S.tab]();
$("#tabs").innerHTML=TABS.filter(t=>t[0]!="admin"||S.admin).map(([k,n,i])=>`<button class="${S.tab==k?"on":""}" data-act="tab" data-v="${k}">${ic(i)}<span>${n}</span></button>`).join("");
document.querySelectorAll(".num").forEach(e=>keep?e.textContent=e.dataset.to:countUp(e,+e.dataset.to));scrollTo(0,keep?y:0)}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2400)}
function setTheme(t){document.documentElement.dataset.theme=t;$("#theme").innerHTML=ic(t=="dark"?"sun":"moon");const bg=t=="dark"?"#151619":"#f3f3f4";document.querySelector("meta[name=theme-color]").content=bg;try{tg&&(tg.setHeaderColor(bg),tg.setBackgroundColor(bg))}catch(e){}}

document.addEventListener("click",e=>{if(!e.target.closest(".hot"))document.querySelectorAll(".hot.open").forEach(x=>x.classList.remove("open"));const ea=e.target.closest(".ct a");if(ea&&tg){try{if(/^https:\/\/t\.me\//.test(ea.href)){e.preventDefault();tg.openTelegramLink(ea.href)}else if(/^https?:/.test(ea.href)){e.preventDefault();tg.openLink(ea.href)}}catch(x){}}
const b=e.target.closest("[data-act]");if(b&&!b.disabled){hap();const a=b.dataset.act,v=b.dataset.v;
if(a=="tab"){S.tab=v;render()}
else if(a=="country"){S.country=v;render(1)}
else if(a=="niche"){S.niche=+v;render(1)}
else if(a=="flt"){S.flt=v;render(1)}
else if(a=="count"){S.count=+v;render(1)}
else if(a=="filter"){S.filter=v;render(1)}
else if(a=="st"){const l=leads.find(x=>x.id==b.dataset.id);if(l){l.status=l.status==v?"new":v;render(1)}}
else if(a=="edit"){const i=+v;S.edit=S.edit===i?null:i;S.editVal=USERS[i].lim;render(1)}
else if(a=="limd"){S.editVal=Math.max(0,Math.min(1000,S.editVal+ +v));render(1)}
else if(a=="limset"){S.editVal=+v;render(1)}
else if(a=="limcancel"){S.edit=null;render(1)}
else if(a=="limsave"){const u=USERS[S.edit];u.lim=S.editVal;S.edit=null;toast(`Лимит ${u.n}: ${u.lim} в день`);render(1)}
else if(a=="tip"){const o=b.classList.contains("open");document.querySelectorAll(".hot.open").forEach(x=>x.classList.remove("open"));if(!o)b.classList.add("open")}
else if(a=="toast")toast(v);
else if(a=="go")go()}
if(e.target.closest("#theme")){hap();setTheme(document.documentElement.dataset.theme=="dark"?"light":"dark")}});
document.addEventListener("input",e=>{if(e.target.id=="city")S.city=e.target.value;if(e.target.id=="cn")S.custom=e.target.value});
setTheme("dark");render();
/* SDK Telegram грузится в фоне: если telegram.org медленный или недоступен, приложение всё равно работает */
(function(){const sc=document.createElement("script");sc.src="https://telegram.org/js/telegram-web-app.js";
sc.onload=()=>{tg=window.Telegram&&Telegram.WebApp;try{tg&&(tg.ready(),tg.expand())}catch(e){}
if(tg&&tg.initData&&tg.colorScheme=="light")setTheme("light");
if(S.tab=="search"&&document.activeElement.tagName!="INPUT")render(1)};document.head.appendChild(sc)})();
</script>
